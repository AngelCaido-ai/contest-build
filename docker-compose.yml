services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      CADDY_SITE_ADDRESS: "${CADDY_SITE_ADDRESS:-:80}"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      backend:
        condition: service_healthy
  postgres:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-contest}"
      POSTGRES_USER: "${POSTGRES_USER:-contest}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-contest}"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-contest} -d ${POSTGRES_DB:-contest}"]
      interval: 5s
      timeout: 5s
      retries: 5
  redis:
    image: redis:7
    restart: unless-stopped
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ./.env
    environment:
      PYTHONPATH: /app/backend
      DATABASE_URL: "postgresql+psycopg2://${POSTGRES_USER:-contest}:${POSTGRES_PASSWORD:-contest}@postgres:5432/${POSTGRES_DB:-contest}"
      REDIS_URL: redis://redis:6379/0
      BOT_SECRET: "${BOT_SECRET}"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: sh -c "cd backend && alembic upgrade head && cd .. && uvicorn backend.app.main:app --host 0.0.0.0 --port 8000 --proxy-headers --forwarded-allow-ips='*'"
    expose:
      - "8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ./.env
    environment:
      PYTHONPATH: /app/backend
      DATABASE_URL: "postgresql+psycopg2://${POSTGRES_USER:-contest}:${POSTGRES_PASSWORD:-contest}@postgres:5432/${POSTGRES_DB:-contest}"
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    command: python -m backend.worker
  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ./.env
    environment:
      PYTHONPATH: /app/backend
      DATABASE_URL: "postgresql+psycopg2://${POSTGRES_USER:-contest}:${POSTGRES_PASSWORD:-contest}@postgres:5432/${POSTGRES_DB:-contest}"
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    command: python backend/worker/scheduler.py
  bot:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ./.env
    environment:
      API_BASE_URL: http://backend:8000
      BOT_SECRET: "${BOT_SECRET}"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    command:
      - bash
      - -c
      - |
        if [ -z "$$BOT_TOKEN" ]; then
          echo "BOT_TOKEN is empty, waiting..."
          while true; do sleep 3600; done
        else
          python -m bot.app.main
        fi
  watcher:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ./.env
    environment:
      API_BASE_URL: http://backend:8000
      BOT_SECRET: "${BOT_SECRET}"
    depends_on:
      backend:
        condition: service_healthy
    command:
      - bash
      - -c
      - |
        if [ -z "$$WATCHER_BOT_TOKEN" ]; then
          echo "WATCHER_BOT_TOKEN is empty, waiting..."
          while true; do sleep 3600; done
        else
          python -m watcher.app.main
        fi
volumes:
  pgdata:
  redisdata:
  caddy_data:
  caddy_config:
