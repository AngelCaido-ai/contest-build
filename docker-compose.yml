version: "3.9"
services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: contest
      POSTGRES_USER: contest
      POSTGRES_PASSWORD: contest
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U contest -d contest"]
      interval: 5s
      timeout: 5s
      retries: 5
  redis:
    image: redis:7
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - ./.env
    environment:
      PYTHONPATH: /app/backend
      DATABASE_URL: postgresql+psycopg2://contest:contest@postgres:5432/contest
      REDIS_URL: redis://redis:6379/0
      BOT_SECRET: "${BOT_SECRET}"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: sh -c "cd backend && alembic upgrade head && cd .. && uvicorn backend.app.main:app --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - ./.env
    environment:
      PYTHONPATH: /app/backend
      DATABASE_URL: postgresql+psycopg2://contest:contest@postgres:5432/contest
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_started
    command: python -m backend.worker
  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - ./.env
    environment:
      PYTHONPATH: /app/backend
      DATABASE_URL: postgresql+psycopg2://contest:contest@postgres:5432/contest
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_started
    command: python backend/worker/scheduler.py
  bot:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - ./.env
    environment:
      API_BASE_URL: http://backend:8000
      BOT_SECRET: "${BOT_SECRET}"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_started
    command:
      - bash
      - -c
      - |
        if [ -z "$$BOT_TOKEN" ]; then
          echo "BOT_TOKEN is empty, waiting..."
          while true; do sleep 3600; done
        else
          python -m bot.app.main
        fi
  miniapp:
    build:
      context: ./miniapp
      dockerfile: Dockerfile
    environment:
      VITE_API_BASE: http://localhost:8000
      VITE_BOT_URL: https://t.me/
    depends_on:
      backend:
        condition: service_started
    ports:
      - "5173:5173"
volumes:
  pgdata:
  redisdata:
